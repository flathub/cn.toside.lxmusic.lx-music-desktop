app-id: cn.toside.lxmusic.lx-music-desktop
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: run.sh
separate-locales: false
rename-desktop-file: lx-music-desktop.desktop
rename-icon: lx-music-desktop
finish-args:
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --filesystem=xdg-music
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.mpris.MediaPlayer2.chromium.instance2
modules:
  - name: lx-music-desktop
    buildsystem: simple
    build-commands:
      - bsdtar -O -xf lx-music-desktop*.deb data.* | bsdtar --no-same-owner -xf -
      - install -D -m 644 -t $FLATPAK_DEST/share/applications usr/share/applications/lx-music-desktop.desktop
      - desktop-file-edit --set-key=Exec --set-value="run.sh %U" $FLATPAK_DEST/share/applications/lx-music-desktop.desktop
      - |
        for s in 16 32 48 64 128 256 512; do
          install -Dm644 -t ${FLATPAK_DEST}/share/icons/hicolor/${s}x${s}/apps usr/share/icons/hicolor/${s}x${s}/apps/lx-music-desktop.png
        done
      - mv opt/lx-music-desktop $FLATPAK_DEST
      - install -D -m 644 -t $FLATPAK_DEST/share/metainfo ${FLATPAK_ID}.metainfo.xml
      - install -D -m 755 -t $FLATPAK_DEST/bin run.sh
    sources:
      - type: file
        only-arches: [x86_64]
        url: https://github.com/lyswhut/lx-music-desktop/releases/download/v2.12.5/lx-music-desktop_2.12.5_amd64.deb
        sha256: 1f9b579303e7d32099d949c89dd2770fdb8c06f5c5936be235bc4c869cd98690
        x-checker-data:
          type: json
          url: https://api.github.com/repos/lyswhut/lx-music-desktop/releases/latest
          tag-query: .tag_name
          version-query: $tag | sub("^v"; "")
          url-query: .assets[] | select(.name=="lx-music-desktop_" + $version + "_amd64.deb")
            | .browser_download_url
          timestamp-query: .published_at
      - type: file
        only-arches: [aarch64]
        url: https://github.com/lyswhut/lx-music-desktop/releases/download/v2.12.5/lx-music-desktop_2.12.5_arm64.deb
        sha256: f3e5069ed618f2eaae86cdc7369245b60fbc68c19965ee9d337ce53abbb1fd13
        x-checker-data:
          type: json
          url: https://api.github.com/repos/lyswhut/lx-music-desktop/releases/latest
          tag-query: .tag_name
          version-query: $tag | sub("^v"; "")
          url-query: .assets[] | select(.name=="lx-music-desktop_" + $version + "_arm64.deb")
            | .browser_download_url
          timestamp-query: .published_at
      - type: script
        dest-filename: run.sh
        commands:
          - exec zypak-wrapper /app/lx-music-desktop/lx-music-desktop "$@"
      - type: file
        path: cn.toside.lxmusic.lx-music-desktop.metainfo.xml
